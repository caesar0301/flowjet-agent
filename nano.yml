# FlowJet (fj) example config for the local Mac Studio inference stack.
# Place and modify this file in ~/.soothe/config/nano.yml.
#
# Or use config argument to set session level configs:
# Usage: fj -c ./nano.yml who are you

providers:
  - name: omlx
    provider_type: openai
    api_base_url: "http://localhost:9642/v1"
    api_key: ""
    models:
      - DeepSeek-V4-Flash-2bit-DQ
      - DeepSeek-OCR-4bit

router_profiles:
  - name: default
    router:
      default: "omlx:DeepSeek-V4-Flash-2bit-DQ"
      fast: "omlx:DeepSeek-V4-Flash-2bit-DQ"
      think: "omlx:DeepSeek-V4-Flash-2bit-DQ"
      ocr: "omlx:DeepSeek-OCR-4bit"
      image: "omlx:DeepSeek-OCR-4bit"

active_router_profile: default

persistence:
  default_backend: sqlite

security:
  allow_paths_outside_workspace: true
