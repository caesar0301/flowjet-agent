# FlowJet (fj) config — Muse-Glimmer profile on the oMLX OpenAI-compatible server.
#
# Usage:
#   fj -c ./nano.yml who are you
#
# Routes the default/fast/think roles to the Muse-Glimmer-30B-4bit model
# served by the oMLX endpoint. The Muse-Glimmer model emits an internal
# self-talk protocol (to=self<|message|>…<|eom|>) and embeds tool calls as
# <atem:function_calls> XML in the content field; soothe-nano's
# OpenAICompatModelWrapper (muse_glimmer adapter) translates that wire shape
# into clean content + structured tool_calls automatically — model names
# starting with "muse-glimmer" trigger the adapter in the LLMFactory.
#
# Requires the oMLX server reachable at the api_base_url below.

providers:
  - name: omlx
    provider_type: openai
    api_base_url: "http://100.75.70.86:9642/v1"
    api_key: "mirasoth"
    models:
      - Muse-Glimmer-30B-4bit

router_profiles:
  - name: muse-glimmer
    router:
      default: "omlx:Muse-Glimmer-30B-4bit"
      fast: "omlx:Muse-Glimmer-30B-4bit"
      think: "omlx:Muse-Glimmer-30B-4bit"

active_router_profile: muse-glimmer

# fj defaults to sqlite checkpointer via apply_fj_defaults(); keep persistence
# explicit so the profile is self-contained for `fj -c ./nano.yml`.
persistence:
  default_backend: sqlite

security:
  allow_paths_outside_workspace: true
